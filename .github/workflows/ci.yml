name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 테스트·포맷터의 로컬 타임존 의존을 줄이기 위해 UTC 고정
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/injected-observer.js 는 gitignore — 클린 클론에서 먼저 생성해야 한다.
      - name: Build injected observer
        run: npm run build:inject

      - name: Check version sync
        run: npm run check:version

      - name: Check injected observer up to date
        run: npm run check:injected

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck (TypeScript 7)
        run: npm run typecheck

      - name: Check coverage calibration
        run: npm run check:coverage-calibration

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Typecheck (TypeScript 6 parity)
        run: npm run typecheck:ts6

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  extension-e2e:
    name: Extension browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      EXTENSION_E2E_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Capture, persist, reload, and download real exports
        run: npm run test:e2e:extension
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-failure
          path: test-results/
          if-no-files-found: ignore
