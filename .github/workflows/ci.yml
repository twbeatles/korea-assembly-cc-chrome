name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/injected-observer.js 는 gitignore — 클린 클론에서 먼저 생성해야 한다.
      - name: Build injected observer
        run: npm run build:inject

      - name: Check version sync
        run: npm run check:version

      - name: Check injected observer up to date
        run: npm run check:injected

      - name: Lint
        run: npm run lint

      - name: Typecheck (TypeScript 7)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
